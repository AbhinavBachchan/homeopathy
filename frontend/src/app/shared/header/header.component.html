<header class="topbar">
  <a routerLink="/" class="logo">Trusted homeopathy care</a>
  <div class="actions">
    <ng-container *ngIf="auth.currentUser(); else guestActions">
      <a routerLink="/favorites" class="nav-icon-btn" aria-label="Favorites">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span class="icon-badge">{{ favoritesCount }}</span>
      </a>
      <a routerLink="/cart" class="nav-icon-btn" aria-label="Shopping Cart">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="icon-badge">{{ cartCount }}</span>
      </a>
      <p class="user-name">{{ auth.currentUser()?.name | titlecase }}</p>
      <button type="button" class="logout-btn" (click)="logout()">Logout</button>
    </ng-container>
    <ng-template #guestActions>
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
    </ng-template>

  </div>
  
</header>
